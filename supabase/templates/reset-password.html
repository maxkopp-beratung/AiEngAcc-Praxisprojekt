<!-- Supabase → Authentication → Emails → Templates → "Reset password"
     Betreff: Neues Passwort für WattWann -->
<h2>Neues Passwort für WattWann</h2>
<p>Du hast ein neues Passwort angefordert. Über diesen Link kannst du es setzen:</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery">Neues Passwort setzen</a></p>
<p>Der Link gilt 1 Stunde und nur einmal.</p>
<p>Du hast kein neues Passwort angefordert? Dann ignoriere diese Mail einfach, dein Passwort bleibt unverändert.</p>
